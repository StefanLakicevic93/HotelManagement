<div class="center-form">
    <img src="../../../../assets/logo.png" alt="logo" class="logo"/>
    <h2>Enter Details to Login</h2>

    <form nz-form [formGroup]="loginForm" class="custom-form" (ngSubmit)="submitForm()">

        <nz-form-item>
            <nz-form-control nzErrorTip="Please input your email">
                <nz-input-group nzPrefixIcon="user">
                    <input type="email" nz-input formControlName="email" placeholder="Enter Email"/>
                </nz-input-group>

            </nz-form-control>
        </nz-form-item>

        <nz-form-item>
            <nz-form-control nzErrorTip="Please input your password">
                <nz-input-group nzPrefixIcon="user">
                    <input type="password" nz-input formControlName="password" placeholder="Enter Password"/>
                </nz-input-group>

            </nz-form-control>
        </nz-form-item>

        <button nz-button nzType="primary" nzBlock [disabled]="loginForm.invalid"
        class="w-100">Login</button>

    </form>
</div>
