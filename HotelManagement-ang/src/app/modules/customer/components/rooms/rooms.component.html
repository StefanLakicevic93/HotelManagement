<div class="center-form">
  <div class="room-container">
    <div class="room-row" *ngFor="let room of rooms">
      <nz-card style="width: 300px; margin: 16px;" [nzActions]="[actionEdit]">
        <nz-skeleton [nzActive]="true" [nzLoading]="loading" [nzAvatar]="{ size: 'large' }">
          <nz-card-meta
            [nzAvatar]="avatarTemplate"
            nzTitle="{{ room.name }}"
            nzDescription="Type: {{ room.type }}">
          </nz-card-meta>
          <nz-card-meta
            style="margin-left: 49px;"
            nzDescription="Price: {{ room.price }}">
          </nz-card-meta>
        </nz-skeleton>
      </nz-card>

      <ng-template #avatarTemplate>
        <nz-avatar nzSrc="https://img.pikbest.com/origin/10/02/09/36NpIkbEsTmp4.png!bwr800">
        </nz-avatar>
      </ng-template>

      <ng-template #actionEdit>
        <span
          nz-icon
          nzType="check-square"
          [nzTheme]="'twotone'"
          class="icon"
          (click)="showModalMiddle(room.id)">
        </span>
      </ng-template>
    </div>
  </div>

  <div class="pagination">
    <nz-pagination
      [nzPageIndex]="currentPage"
      [nzTotal]="total"
      [nzPageSize]="1"
      (nzPageIndexChange)="pageIndexChange($event)">
    </nz-pagination>
  </div>
</div>

<!-- ✅ Preuređeni modal sa NZ RANGE PICKER-om -->
<nz-modal
  nzTitle="Book Room"
  nzCentered
  [(nzVisible)]="isVisibleMiddle"
  (nzOnCancel)="handleCancelMiddle()"
  (nzOnOk)="handleOkMiddle()">
  <ng-container *nzModalContent>
    <nz-range-picker
  style="width: 100%;"
  [(ngModel)]="date"
  (ngModelChange)="onChange($event)"
  [nzDisabledDate]="disablePastDates"
  [nzFormat]="'yyyy-MM-dd'">
</nz-range-picker>

  </ng-container>
</nz-modal>
